[project]
name = "lca-data-interface"
dynamic = ["version"]
description = "Download LCA databases from openLCA Nexus and LCA Collaboration Servers into a hash-checked cache."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "requests>=2.34,<3",
    "platformdirs>=4.11,<5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "ty==0.0.80",
    "vulture==2.16",
    "coverage==7.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "lca_data_interface/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lca_data_interface"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "S", "B", "SIM114", "C416", "PIE790", "ANN"]
ignore = ["ANN401", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["lca_data_interface"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S106", "S310", "S314", "S603", "ANN"]

[tool.ty.environment]
root = ["."]

[tool.ty.src]
include = ["lca_data_interface"]

[tool.coverage.run]
branch = true
source_pkgs = ["lca_data_interface"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.vulture]
min_confidence = 80
paths = ["lca_data_interface", "tests"]
sort_by_size = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reaches the live services; run with LCA_DATA_INTERFACE_LIVE=1 and -m live"]
addopts = "-m 'not live'"
